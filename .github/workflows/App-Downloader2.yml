name: Manual APK Download from Google Play

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name (e.g., com.whatsapp) or Play Store URL'
        required: true
        type: string
      target_folder:
        description: 'Target folder in repository'
        required: false
        default: 'downloaded-apks'
        type: string

jobs:
  download-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install google-play-scraper
        run: |
          pip install google-play-scraper requests

      - name: Download APK from Google Play
        env:
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          TARGET_FOLDER: ${{ github.event.inputs.target_folder }}
        run: |
          import os
          import re
          import requests
          from google_play_scraper import app
          
          # Extract package name from URL if needed
          package_input = os.environ['PACKAGE_NAME']
          if 'play.google.com' in package_input:
              match = re.search(r'id=([a-zA-Z0-9_.]+)', package_input)
              if match:
                  package_name = match.group(1)
              else:
                  raise Exception("Could not extract package name from URL")
          else:
              package_name = package_input
          
          # Create target folder
          folder = os.environ['TARGET_FOLDER']
          os.makedirs(folder, exist_ok=True)
          
          print(f"Downloading: {package_name}")
          
          # Get app info from Google Play
          app_info = app(
              packageName=package_name,
              lang='en',
              country='us'
          )
          
          # Get download URL from app info
          download_url = app_info['offer'][0]['url']
          print(f"Download URL obtained")
          
          # Download the APK
          output_path = os.path.join(folder, f"{package_name}.apk")
          response = requests.get(download_url, stream=True)
          response.raise_for_status()
          
          total_size = int(response.headers.get('content-length', 0))
          downloaded = 0
          
          with open(output_path, 'wb') as f:
              for chunk in response.iter_content(chunk_size=8192):
                  f.write(chunk)
                  downloaded += len(chunk)
                  if total_size:
                      percent = (downloaded / total_size) * 100
                      print(f"\rProgress: {percent:.1f}%", end='')
          
          print(f"\n✅ Downloaded to: {output_path}")
          print(f"File size: {os.path.getsize(output_path)} bytes")
          
        shell: python

      - name: Commit and Push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add APK for ${{ github.event.inputs.package_name }} [skip ci]"
            git push
            echo "✅ APK successfully pushed to repository"
          fi
